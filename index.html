:root{color-scheme:dark;--bg:#06090d;--gold:#f0b429;--green:#34d399;--red:#f87171;--blue:#60a5fa;--text:#e8f4f2;--muted:#7b8f93}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#2b2f33;color:var(--text);font-family:'Tajawal',sans-serif;min-height:100vh;display:flex;justify-content:center;direction:ltr}
#wrap{width:100%;max-width:640px;padding:8px;display:flex;flex-direction:column;align-items:center}
#stagebox{position:relative;width:100%;display:flex;justify-content:center}
canvas{height:74vh;max-width:100%;aspect-ratio:5/6;background:#0b1a1f;display:block;border-radius:6px}
#pauseBtn{position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:8px;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:1rem;cursor:pointer;z-index:3}
#overlay{position:absolute;inset:0;margin:auto;height:74vh;max-width:100%;aspect-ratio:5/6;background:rgba(4,10,14,.88);display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:12px;text-align:center;padding:20px;border-radius:6px;z-index:4;overflow-y:auto;direction:ltr}
#overlay.hide{display:none}
#overlay h1{font-size:2rem;font-weight:900;color:var(--gold);font-family:'Space Mono',monospace;direction:ltr}
#overlay p{color:#b8c9cc;line-height:1.8;font-size:.9rem}
.btn{padding:12px 28px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--gold),#d97706);color:#000;font-weight:900;font-size:1rem;font-family:inherit;cursor:pointer;flex:none}
.btn2{padding:8px 16px;border-radius:10px;border:1px solid #44585c;background:transparent;color:var(--text);font-family:inherit;cursor:pointer;flex:none}
.inrow{display:flex;gap:8px;width:100%;margin-top:8px;direction:ltr}
#inp{flex:1;min-width:0;padding:13px;border-radius:12px;border:1px solid #3a4b4f;background:#10222a;color:#fff;font-size:1.1rem;font-family:'Space Mono',monospace;outline:none}
#inp:focus{border-color:var(--gold)}
#inp.shake{animation:sh .3s;border-color:var(--red)}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mic{padding:0 18px;border-radius:12px;border:1px solid var(--blue);background:rgba(96,165,250,.12);color:var(--blue);cursor:pointer;font-size:1.2rem}
.mic.on{background:rgba(248,113,113,.2);border-color:var(--red);color:var(--red);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.55}}
#heard{min-height:20px;margin-top:6px;font-size:.8rem;color:#9fb4b8;font-family:'Space Mono',monospace;direction:ltr;width:100%}
.sb{position:absolute;bottom:12px;width:34px;height:34px;border-radius:8px;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:1rem;cursor:pointer;z-index:3}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;direction:ltr}
.sg{padding:10px 0;border-radius:10px;border:1px solid #44585c;background:#10222a;color:#fff;font-family:'Space Mono',monospace;font-weight:700;cursor:pointer}
.sg.done{border-color:var(--green);color:var(--green)}.sg.lock{opacity:.35;cursor:not-allowed}

const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’'`]/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const ART=/^(un|une|le|la|les|l|d|de|du|des) /;
function variants(fr){let o=new Set();fr.split('/').forEach(p=>{[p.replace(/\(.*?\)/g,''),p.replace(/[()]/g,'')].forEach(x=>{let n=norm(x);if(n){o.add(n);o.add(n.replace(ART,''))}})});return [...o]}
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[m][n]}
function ok(heard,vs){const h=norm(heard);if(!h)return false;return vs.some(v=>{if(v.length>2&&(' '+h+' ').includes(' '+v+' '))return true;const hh=h.replace(ART,'');return Math.max(0,1-lev(h,v)/Math.max(h.length,v.length))>=.8||Math.max(0,1-lev(hh,v)/Math.max(hh.length,v.length))>=.8})}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=(a,b)=>a+Math.random()*(b-a);
const strict=(it,t)=>{const h=norm(t);if(!h)return false;const hh=h.replace(ART,'');return it.v.some(v=>v===h||v===hh)};
const match=(it,t,loose)=>loose?ok(t,it.v):strict(it,t);

function pickWords(sents,N){const seen=new Set(),c=[];const add=l=>l.forEach(s=>{(s.fr.match(/\p{L}+/gu)||[]).forEach(t=>{const lo=t.toLowerCase(),n=norm(lo);if(seen.has(n)||!DICT[n]||lo==='sur'||n.length<4)return;seen.add(n);c.push({fr:lo,raw:lo,ar:DICT[n],v:variants(lo),k:'w',sc:n.length+Math.random()*1.5})})});add(sents);const own=c.length;if(own<N)add(D.flatMap(s=>s.w.map(w=>({fr:w[0]}))));const by=a=>a.sort((x,y)=>y.sc-x.sc);return shuf(by(c.slice(0,own)).slice(0,N).concat(own<N?by(c.slice(own)).slice(0,N-own):[]))}

  G.st++;G.lives=4;G.mul=1;loadStage(0)}
function win(){G.over=true;stopMic();if(G.score>best){best=G.score;try{localStorage.setItem('fq_best',best)}catch(e){}}draw();overlay(`<h1>🏆 BRAVO</h1><p>Vous avez terminé les 20 étapes !<br>Score : ${G.score}</p><button class="btn" onclick="menu()">☰ Étapes</button>`)}
function wrapT(t,y,lh){const ws=t.split(' ');let l='',ls=[];for(const x of ws){const n=l?l+' '+x:x;if(ctx.measureText(n).width>W-90&&l){ls.push(l);l=x}else l=n}ls.push(l);ls.forEach((s,i)=>tx(s,W/2,y+i*lh,'rtl'))}
function tx(s,x,y,d){ctx.direction=d||'ltr';ctx.fillText(s,x,y);ctx.direction='ltr'}
const baseV=()=>(20+Math.min(G.st,9)*3.2)*(G.ph==1?.68:1);
function spawn(){
  const item=G.deck[G.ptr];let fs=item.k=='s'?17:24;ctx.font=`700 ${fs}px Tajawal,sans-serif`;let w=ctx.measureText(item.ar).width+22;
  while(w>W-24&&fs>11){fs--;ctx.font=`700 ${fs}px Tajawal,sans-serif`;w=ctx.measureText(item.ar).width+22}
  for(let k=0;k<10;k++){const x=rnd(Math.min(w/2+8,W/2),Math.max(W-w/2-8,W/2));
    if(G.words.every(o=>o.y>70||Math.abs(o.x-x)>(o.w+w)/2+10)){G.ptr++;G.words.push({item,x,y:-24,w,fs,v:rnd(.9,1.15),dying:false,seed:Math.random()*6});return true}}
  return false}
function loop(ts){
  if(!G||G.over)return;const dt=Math.min(.05,(ts-last)/1000);last=ts;
  if(!G.paused)update(dt);draw();raf=requestAnimationFrame(loop)}
function update(dt){
  gridY=(gridY+dt*14)%40;G.mul=Math.min(1.8,G.mul+dt*.0015);
  mood=Math.min(3,Math.floor((G.stageDone/Math.max(1,G.stageTotal))*4));
  if(G.banner>0)G.banner-=dt;
  else{G.spawnT-=dt;const maxOn=G.ph==1?1:G.st<2?3:G.st<6?4:5;
    if(G.ph<2&&G.ptr<G.deck.length&&G.words.length<maxOn&&(G.spawnT<=0||!G.words.some(w=>!w.dying))){if(spawn())G.spawnT=Math.max(.9,2.7-G.st*.14)/Math.sqrt(G.mul)*(G.ph==1?1.3:1)}}
  if(G.ph==2&&G.banner<=0){if(G.qT>0){G.qT-=dt;if(G.qT<=0&&G.stageDone<G.stageTotal)nextQ()}else if(!G.q&&G.stageDone<G.stageTotal)nextQ()}
  for(const w of G.words.slice()){
    if(w.dying)continue;w.y+=baseV()*G.mul*w.v*dt;
    if(w.y>=H-96){G.words=G.words.filter(o=>o!==w);explode(w.x,w.y,'#f87171',34);G.deck.push(w.item);G.lives--;G.combo=0;G.shake=.4;G.flash=.35;if(G.ph==1)G.spawnT=Math.max(G.spawnT,1.2);
      G.reveal={a:w.item.ar,b:w.item.raw};G.revealT=2.5;beep(150,.35,'sawtooth',.09);say(w.item.raw);if(G.lives<=0){failStage();return}}}
  for(const b of G.bullets.slice()){
    const dx=b.t.x-b.x,dy=b.t.y-b.y,d=Math.hypot(dx,dy),s=1500*dt;
    if(d<=s+8){G.bullets=G.bullets.filter(o=>o!==b);G.words=G.words.filter(o=>o!==b.t);explode(b.t.x,b.t.y,'#f7d070',30);explode(b.t.x,b.t.y,'#ffffff',12);
      G.stageDone++;G.combo++;G.score+=10+Math.min(G.combo,10)*2;G.mul=Math.min(1.8,G.mul+.015);if(G.ph==1)G.spawnT=Math.max(G.spawnT,1.2);beep(900,.1,'square',.05);beep(300,.2,'sawtooth',.06)}
    else{b.x+=dx/d*s;b.y+=dy/d*s;b.tr.push([b.x,b.y]);if(b.tr.length>6)b.tr.shift()}}
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt}G.parts=G.parts.filter(p=>p.life>0);
  if(G.flash>0)G.flash-=dt;if(G.shake>0)G.shake-=dt;if(G.revealT>0)G.revealT-=dt;
  const fin=G.ph==2?(G.stageDone>=G.stageTotal&&G.qT<=0):(G.ptr>=G.deck.length&&G.words.length==0&&G.bullets.length==0&&G.banner<=0);if(fin&&G.lives>0)advance()}
function explode(x,y,c,n){for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(60,320);G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rnd(.4,.9),c,r:rnd(1.5,3.5)})}}
function draw(){
  ctx.save();ctx.direction='ltr';if(G.shake>0)ctx.translate(rnd(-5,5),rnd(-5,5));
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a1a20');g.addColorStop(1,'#0e2a30');ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H+20);
  ctx.strokeStyle='rgba(120,200,210,.07)';ctx.lineWidth=1;
  for(let x=0;x<=W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=-40+gridY;y<=H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const w of G.words){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(w.x-w.w/2,w.y-17,w.w,34);
    ctx.strokeStyle=w.dying?'#fff':'rgba(240,180,41,.55)';ctx.lineWidth=1;ctx.strokeRect(w.x-w.w/2,w.y-17,w.w,34);
    ctx.font=`700 ${w.fs}px Tajawal,sans-serif`;ctx.fillStyle=w.dying?'#fff':'#fff4d6';tx(w.item.ar,w.x,w.y+1,'rtl');
    ctx.fillStyle='#f0b429';ctx.beginPath();ctx.arc(w.x+w.w/2+6,w.y-14,4,0,6.28);ctx.fill()}
  if(G.ph==2){ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(24,150,W-48,230);ctx.strokeStyle='rgba(240,180,41,.55)';ctx.strokeRect(24,150,W-48,230);ctx.fillStyle='#7b8f93';ctx.font='700 13px Tajawal,sans-serif';tx('Traduisez en français  '+Math.min(G.stageDone+1,G.stageTotal)+'/'+G.stageTotal,W/2,172);
    if(G.q){ctx.fillStyle='#fff4d6';ctx.font='700 28px Tajawal,sans-serif';wrapT(G.q.ar,225,42);if(G.hint){ctx.fillStyle='#f0b429';ctx.font='700 15px Space Mono,monospace';tx('💡 '+G.q.raw.split(' ').slice(0,2).join(' ')+' …',W/2,350)}}else{ctx.fillStyle='#34d399';ctx.font='900 26px Tajawal,sans-serif';tx('✔ Excellent',W/2,265)}}
  for(const b of G.bullets){ctx.strokeStyle='#7ff5ff';ctx.lineWidth=3;ctx.beginPath();b.tr.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.lineTo(b.x,b.y);ctx.stroke()}
  for(const p of G.parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill()}ctx.globalAlpha=1;
  let ang=-Math.PI/2;const tg=G.bullets[0]?G.bullets[0].t:null;if(tg)ang=Math.atan2(tg.y-SHIP.y,tg.x-SHIP.x);
  ctx.save();ctx.translate(SHIP.x,SHIP.y);ctx.rotate(ang+Math.PI/2);ctx.fillStyle='#38e8d6';ctx.strokeStyle='#baffff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(16,18);ctx.lineTo(0,10);ctx.lineTo(-16,18);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  const typed=$('inp').value;if(typed){ctx.font='700 18px Space Mono,monospace';ctx.fillStyle='#7ff5ff';ctx.textAlign='center';tx(typed,SHIP.x,SHIP.y+44)}
  ctx.textAlign='left';ctx.font='700 16px Space Mono,monospace';ctx.fillStyle='#e8f4f2';tx('SCORE '+G.score,56,24);
  ctx.fillStyle='#7b8f93';ctx.font='12px Space Mono,monospace';tx('MEILLEUR '+Math.max(best,G.score)+'   x'+G.mul.toFixed(2),56,44);tx('♪ '+(mood+1)+'/4',56,60);tx('VITESSE '+(baseV()*(G.mul||1)/20).toFixed(1)+'x',56,76);
  ctx.textAlign='right';ctx.fillStyle='#f0b429';ctx.font='700 14px Space Mono,monospace';tx('ÉTAPE '+(G.st+1)+' · '+['MOTS','DIRE','TRAD'][G.ph]+'  '+G.stageDone+'/'+G.stageTotal,W-12,24);
  if(G.combo>2){ctx.fillStyle='#34d399';tx('COMBO x'+G.combo,W-12,44)}
  ctx.save();ctx.translate(W-34,H-40);ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.lineTo(Math.cos(a)*20,Math.sin(a)*20)}ctx.closePath();ctx.fillStyle=G.lives>1?'#f5c518':'#f87171';ctx.fill();
  ctx.fillStyle='#000';ctx.textAlign='center';ctx.font='700 18px Space Mono,monospace';tx(String(G.lives),0,1);ctx.restore();
  if(G.revealT>0&&G.reveal){ctx.globalAlpha=Math.min(1,G.revealT);ctx.textAlign='center';ctx.fillStyle='#fca5a5';ctx.font='700 16px Tajawal,sans-serif';tx(G.reveal.a,W/2,H-140,'rtl');let fs=15;ctx.font=`700 ${fs}px Space Mono,monospace`;while(ctx.measureText(G.reveal.b).width>W-24&&fs>9){fs--;ctx.font=`700 ${fs}px Space Mono,monospace`}ctx.fillStyle='#f87171';tx(G.reveal.b,W/2,H-118);ctx.globalAlpha=1}
  if(G.banner>0){ctx.globalAlpha=Math.min(1,G.banner);ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,H/2-50,W,112);ctx.fillStyle='#f0b429';ctx.textAlign='center';ctx.font='900 24px Space Mono,monospace';tx(G.bannerTxt,W/2,H/2-14);ctx.fillStyle='#b8c9cc';ctx.font='14px Tajawal,sans-serif';tx(G.sub||'',W/2,H/2+14);ctx.fillStyle='#7b8f93';ctx.font='12px Space Mono,monospace';tx(G.title||'',W/2,H/2+40);ctx.globalAlpha=1}
  if(G.flash>0){ctx.fillStyle=`rgba(248,113,113,${G.flash*.5})`;ctx.fillRect(0,0,W,H)}
  ctx.restore()}
function togglePause(){if(!G||G.over||!G.run)return;G.paused=!G.paused;if(G.paused)overlay(`<h1>PAUSE</h1><button class="btn" onclick="togglePause()">▶ Reprendre</button>`);else{$('overlay').classList.add('hide');last=performance.now();$('inp').focus()}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&G.run&&!G.over&&!G.paused)togglePause()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')togglePause();else if(G&&G.run&&!G.over&&!G.paused&&document.activeElement!==$('inp')&&e.key.length==1)$('inp').focus()});

// ---- reconnaissance des réponses ----
function target(txt,loose){if(!norm(txt))return null;let b=null;
  for(const w of G.words){if(w.dying)continue;if(match(w.item,txt,loose)&&(!b||w.y>b.y))b=w}
  return b}
function hit(w){w.dying=true;G.bullets.push({x:SHIP.x,y:SHIP.y,t:w,tr:[]});beep(1400,.06,'square',.04);say(w.item.raw)}
const inp=$('inp');
inp.addEventListener('input',()=>{if(!G||!G.run||G.over||G.paused)return;if(G.ph==2){if(ans(inp.value,false))inp.value='';return}const w=target(inp.value,false);if(w){hit(w);inp.value=''}});
inp.addEventListener('keydown',e=>{if(e.key!=='Enter'||!G||!G.run||G.over||G.paused)return;if(G.ph==2){const t=inp.value.trim();if(t&&G.q&&!ans(t,true))miss2();inp.value='';return}const w=target(inp.value,true);if(w)hit(w);else if(inp.value.trim()){inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),300)}inp.value=''});

// ---- micro ----
let rec=null;
function toggleMic(){music();rec?stopMic():startMic()}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('heard').textContent='Micro non pris en charge : utilisez Chrome ou Edge';return}
  rec=new SR();rec.lang='fr-FR';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=3;
  rec.onresult=e=>{if(!G||!G.run||G.over||G.paused)return;const r=e.results[e.results.length-1];let h=null,heard='';
    for(let k=0;k<r.length;k++){heard=heard||r[k].transcript;if(G.ph==2){if(ans(r[k].transcript,true)){heard=r[k].transcript;try{rec&&rec.stop()}catch(_){}break}continue}const w=target(r[k].transcript,true);if(w){h=w;heard=r[k].transcript;break}}
    $('heard').textContent='🎧 '+heard;if(h){hit(h);try{rec&&rec.stop()}catch(_){}}};
  rec.onerror=e=>{if(e.error=='not-allowed'||e.error=='service-not-allowed'){$('heard').textContent='Micro refusé : autorisez le micro dans le navigateur';stopMic()}};
  rec.onend=()=>{if(rec){try{rec.start()}catch(_){}}};
  try{rec.start();$('micBtn').classList.add('on')}catch(e){rec=null}}
function stopMic(){const r=rec;rec=null;$('micBtn').classList.remove('on');if(r)try{r.stop()}catch(_){}}
try{speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
G={st:0,ph:0,qT:0,hint:0,q:null,sub:'',title:'',words:[],bullets:[],parts:[],lives:4,score:0,combo:0,mul:1,banner:0,flash:0,revealT:0,shake:0,stageDone:0,stageTotal:0,deck:[],ptr:0};
draw();menu();
</script>
